<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Go-Emby · 媒体库</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e8ebf0; --muted:#9aa4b2; --accent:#3f8cff; --accent2:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--fg)}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;background:linear-gradient(90deg,#141821,#0f1115);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header .brand{font-weight:700;font-size:18px;letter-spacing:.5px}
  header .brand span{color:var(--accent)}
  .tabs{display:flex;gap:8px;margin-left:12px}
  .tab{padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px}
  .tab.active{background:var(--panel2);color:var(--fg)}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:13px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    padding:8px 14px;border-radius:8px;font-size:14px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ghost{background:transparent}
  button.danger{background:transparent;border-color:#5b2a2a;color:#ff8f8f}
  input{background:#0c0e12;border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:8px;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  main{padding:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
    transition:transform .12s ease,border-color .12s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .poster{aspect-ratio:2/3;width:100%;object-fit:cover;background:#0b0d11;display:block}
  .card .meta{padding:9px 10px}
  .card .tt{font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .sub{font-size:11px;color:var(--muted);margin-top:3px}
  .empty{color:var(--muted);padding:40px;text-align:center}
  /* login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .login{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
  .login h1{margin:0 0 4px;font-size:22px}
  .login p{margin:0 0 20px;color:var(--muted);font-size:13px}
  .login .row{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .login input{width:100%}
  .login button{width:100%;margin-top:6px}
  .err{color:var(--danger);font-size:13px;min-height:18px}
  /* detail modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .modal-mask.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:900px;width:100%;
    max-height:90vh;overflow:auto}
  .modal .head{display:flex;gap:18px;padding:20px}
  .modal .head img{width:160px;border-radius:10px;background:#0b0d11}
  .modal .head .info{flex:1}
  .modal h2{margin:0 0 8px}
  .modal .desc{color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0}
  .modal video{width:100%;background:#000;display:block;border-radius:0 0 16px 16px}
  .close{position:absolute;right:26px;top:22px;font-size:22px;color:var(--muted);cursor:pointer}
  /* admin */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .n{font-size:26px;font-weight:700}
  .stat .l{color:var(--muted);font-size:13px;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
  .panel h3{margin:0 0 14px;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-wrap">
  <div class="login">
    <h1>Go-Emby <span style="color:var(--accent)">复刻版</span></h1>
    <p>Emby 兼容媒体服务器 · 登录以进入媒体库</p>
    <div class="row">
      <input id="loginUser" placeholder="用户名" value="admin" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="密码（默认 admin）" autocomplete="current-password" />
    </div>
    <div id="loginErr" class="err"></div>
    <button class="primary" id="loginBtn">登录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="appView" class="hidden">
  <header>
    <div class="brand">Go-<span>Emby</span></div>
    <div class="tabs">
      <div class="tab active" data-tab="library">媒体库</div>
      <div class="tab" data-tab="admin">后台管理</div>
      <div class="tab" data-tab="files">文件</div>
    </div>
    <div class="spacer"></div>
    <select id="langSel" style="background:#0c0e12;border:1px solid var(--line);color:var(--fg);padding:6px 8px;border-radius:8px;font-size:13px">
      <option value="zh">中文</option><option value="en">English</option>
    </select>
    <span class="who" id="who"></span>
    <button class="ghost" id="logoutBtn">退出</button>
  </header>

  <main>
    <section id="tab-library">
      <div class="row-flex" style="margin-bottom:16px">
        <button class="primary" id="refreshBtn">刷新媒体库</button>
        <input id="searchBox" placeholder="搜索片名…" style="width:260px" />
        <span class="tag" id="countTag"></span>
      </div>
      <div id="wall" class="grid"></div>
    </section>

    <section id="tab-admin" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="panel">
        <h3>运维</h3>
        <div class="row-flex" style="margin-bottom:10px">
          <button class="primary" id="scrapeBtn">TMDB 刮削</button>
          <button id="syncBtn">Xiaoya / OpenList 同步</button>
          <button id="probeBtn">媒体信息探测</button>
          <span class="tag" id="opsInfo">—</span>
        </div>
      </div>
      <div class="panel">
        <h3>增强设置</h3>
        <div class="row-flex" style="flex-wrap:wrap;gap:12px;align-items:center">
          <label>服务器名 <input id="setServerName" style="width:150px" /></label>
          <label>扫描并发 <input id="setScanConc" type="number" min="1" max="64" style="width:80px" /></label>
          <label>监听延时(s) <input id="setWatchDelay" type="number" min="10" style="width:90px" /></label>
          <label><input type="checkbox" id="setProxyDebug" /> 代理调试</label>
          <label><input type="checkbox" id="setFastCDN" /> FastCDN</label>
          <label><input type="checkbox" id="setInitials" /> 首字母搜索</label>
          <label><input type="checkbox" id="setWatch" /> 文件监听</label>
          <label><input type="checkbox" id="setMergeFolder" /> 同库合并多版本</label>
          <label><input type="checkbox" id="setMergeLibs" /> 跨库合并多版本</label>
          <button class="primary" id="saveEnhBtn">保存设置</button>
          <span class="tag" id="enhInfo">—</span>
        </div>
      </div>
      <div class="panel">
        <h3>用户管理</h3>
        <div class="row-flex" style="margin-bottom:12px">
          <input id="newUserName" placeholder="新用户名" />
          <input id="newUserPass" placeholder="密码（可空）" />
          <button class="primary" id="createUserBtn">创建用户</button>
        </div>
        <table><thead><tr><th>用户名</th><th>管理员</th><th>播放</th><th>下载</th><th>设备上限</th><th>操作</th></tr></thead>
          <tbody id="usersBody"></tbody></table>
      </div>
      <div class="panel">
        <h3>日志</h3>
        <div class="row-flex" style="margin-bottom:10px">
          <select id="logType" style="background:#0c0e12;border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px">
            <option value="all">全部</option>
            <option value="activity">常规</option>
            <option value="error">错误</option>
            <option value="redirect">重定向</option>
          </select>
          <button id="logRefreshBtn">刷新日志</button>
          <span class="tag" id="logInfo"></span>
        </div>
        <table><thead><tr><th>时间</th><th>类型</th><th>事件</th><th>详情</th></tr></thead>
          <tbody id="activityBody"></tbody></table>
      </div>
    </section>

    <section id="tab-files" class="hidden">
      <div class="panel">
        <h3>文件管理</h3>
        <div class="row-flex" style="margin-bottom:12px">
          <input id="filePath" placeholder="路径，如 /Movies" value="/" style="width:320px" />
          <button class="primary" id="fileListBtn">浏览</button>
          <span class="tag" id="fileInfo"></span>
        </div>
        <table><thead><tr><th>名称</th><th>类型</th><th>大小</th><th>操作</th></tr></thead>
          <tbody id="filesBody"></tbody></table>
      </div>
    </section>
  </main>
</div>

<!-- 详情/播放弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal" style="position:relative">
    <span class="close" id="modalClose">✕</span>
    <div class="head">
      <img id="mPoster" alt="poster" />
      <div class="info">
        <h2 id="mTitle"></h2>
        <div class="sub" id="mSub" style="color:var(--muted);font-size:13px"></div>
        <div class="desc" id="mDesc"></div>
        <button class="primary" id="playBtn">▶ 播放</button>
        <label class="tag" style="cursor:pointer;margin-left:8px">上传海报<input type="file" id="posterFile" accept="image/*" style="display:none"></label>
      </div>
    </div>
    <video id="player" class="hidden" controls playsinline></video>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { token: localStorage.getItem('ge_token') || '', user: null, items: [], current: null, lang: localStorage.getItem('ge_lang') || 'zh' };

const I18N = {
 zh:{tab_library:'媒体库',tab_admin:'后台管理',tab_files:'文件',logout:'退出',loginTitle:'Go-Emby 复刻版',loginSub:'Emby 兼容媒体服务器 · 登录以进入媒体库',loginUser:'用户名',loginPass:'密码（默认 admin）',login:'登录',refresh:'刷新媒体库',searchPh:'搜索片名…',ops:'运维',enh:'增强设置',users:'用户管理',logs:'日志',filesPanel:'文件管理',scrape:'TMDB 刮削',sync:'Xiaoya / OpenList 同步',probe:'媒体信息探测',save:'保存设置',createUser:'创建用户',logRefresh:'刷新日志',browse:'浏览',play:'▶ 播放'},
 en:{tab_library:'Library',tab_admin:'Admin',tab_files:'Files',logout:'Sign out',loginTitle:'Go-Emby Clone',loginSub:'Emby-compatible media server · sign in',loginUser:'Username',loginPass:'Password (default admin)',login:'Sign in',refresh:'Refresh library',searchPh:'Search titles…',ops:'Operations',enh:'Enhancements',users:'Users',logs:'Logs',filesPanel:'File Manager',scrape:'TMDB Scrape',sync:'Xiaoya / OpenList Sync',probe:'Probe Media Info',save:'Save',createUser:'Create user',logRefresh:'Refresh logs',browse:'Browse',play:'▶ Play'}
};
function t(k){ const l=I18N[state.lang]||I18N.zh; return l[k]||I18N.zh[k]||k; }
function setText(sel,txt){ const el=document.querySelector(sel); if(el) el.textContent=txt; }
function setPh(sel,txt){ const el=document.querySelector(sel); if(el) el.placeholder=txt; }
function applyLang(){
  document.querySelectorAll('.tab[data-tab]').forEach(tb=>{ tb.textContent=t('tab_'+tb.dataset.tab); });
  setText('#logoutBtn',t('logout'));
  setText('#loginView h1',t('loginTitle'));
  setText('#loginView p',t('loginSub'));
  setPh('#loginUser',t('loginUser')); setPh('#loginPass',t('loginPass')); setText('#loginBtn',t('login'));
  setText('#refreshBtn',t('refresh')); setPh('#searchBox',t('searchPh'));
  const hs=document.querySelectorAll('#tab-admin .panel h3');
  if(hs[0])hs[0].textContent=t('ops');
  if(hs[1])hs[1].textContent=t('enh');
  if(hs[2])hs[2].textContent=t('users');
  if(hs[3])hs[3].textContent=t('logs');
  const fh=document.querySelector('#tab-files .panel h3'); if(fh)fh.textContent=t('filesPanel');
  setText('#scrapeBtn',t('scrape')); setText('#syncBtn',t('sync')); setText('#probeBtn',t('probe'));
  setText('#saveEnhBtn',t('save')); setText('#createUserBtn',t('createUser')); setText('#logRefreshBtn',t('logRefresh'));
  setText('#fileListBtn',t('browse')); setText('#playBtn',t('play'));
}
const _langSel=document.querySelector('#langSel');
if(_langSel){ _langSel.value=state.lang; _langSel.onchange=()=>{ state.lang=_langSel.value; localStorage.setItem('ge_lang',state.lang); applyLang(); }; }

async function editPolicy(u){
  if(!u) return;
  const p = u.Policy || {};
  const md = prompt('最大并发设备数（0 = 不限制）', (p.MaxActiveDevices||0));
  if(md===null) return;
  const play = prompt('允许播放？输入 y=允许 / n=禁止', p.EnableMediaPlayback===false?'n':'y');
  if(play===null) return;
  const dl = prompt('允许下载？输入 y=允许 / n=禁止', p.EnableContentDownloading===false?'n':'y');
  if(dl===null) return;
  const body = {
    MaxActiveDevices: parseInt(md,10)||0,
    EnableMediaPlayback: play.trim().toLowerCase()!=='n',
    EnableContentDownloading: dl.trim().toLowerCase()!=='n'
  };
  try{ await api('/Users/'+u.Id+'/Policy',{method:'PUT',body:JSON.stringify(body)}); loadAdmin(); }
  catch(e){ alert('保存失败：'+e.message); }
}

function api(path, opts={}){
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.token) opts.headers['X-Emby-Token'] = state.token;
  return fetch(path, opts).then(async r => {
    const txt = await r.text();
    let data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = txt; }
    if(!r.ok) throw new Error((data && data.error) || ('HTTP '+r.status));
    return data;
  });
}

/* ---------- 登录 ---------- */
async function doLogin(){
  const username = $('#loginUser').value.trim();
  const pw = $('#loginPass').value;
  $('#loginErr').textContent = '';
  try{
    const res = await fetch('/Users/AuthenticateByName', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({Username:username, Pw:pw})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '登录失败');
    state.token = data.AccessToken;
    state.user = data.User;
    localStorage.setItem('ge_token', state.token);
    localStorage.setItem('ge_user', JSON.stringify(state.user));
    enterApp();
  }catch(e){ $('#loginErr').textContent = e.message; }
}

function enterApp(){
  $('#loginView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  $('#who').textContent = state.user ? (state.user.Name + (state.user.IsAdmin ? ' · 管理员' : '')) : '';
  loadWall();
  loadAdmin();
}

function logout(){
  state.token=''; state.user=null;
  localStorage.removeItem('ge_token'); localStorage.removeItem('ge_user');
  location.reload();
}

/* ---------- 媒体库 ---------- */
async function loadWall(){
  const wall = $('#wall');
  wall.innerHTML = '<div class="empty">加载中…</div>';
  try{
    const res = await api('/Users/'+state.user.Id+'/Items?Recursive=true&IncludeItemTypes=Movie,Series&SortBy=SortName&Limit=500');
    state.items = res.Items || [];
    renderWall(state.items);
  }catch(e){ wall.innerHTML = '<div class="empty">加载失败：'+e.message+'</div>'; }
}

function renderWall(items){
  const wall = $('#wall');
  $('#countTag').textContent = items.length + ' 个条目';
  if(!items.length){ wall.innerHTML = '<div class="empty">媒体库为空，请把影视文件放入 MEDIA_ROOTS 后点“刷新媒体库”。</div>'; return; }
  wall.innerHTML = '';
  for(const it of items){
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.className='poster'; img.loading='lazy';
    img.src = '/Items/'+it.Id+'/Images/Primary?maxWidth=300&api_key='+encodeURIComponent(state.token);
    img.onerror = () => { img.style.visibility='hidden'; };
    const meta = document.createElement('div'); meta.className='meta';
    const tt = document.createElement('div'); tt.className='tt'; tt.textContent = it.Name;
    const sub = document.createElement('div'); sub.className='sub';
    sub.textContent = (it.Type==='Series' ? '剧集' : '电影') + (it.ProductionYear ? ' · '+it.ProductionYear : '');
    meta.appendChild(tt); meta.appendChild(sub);
    card.appendChild(img); card.appendChild(meta);
    card.onclick = () => openDetail(it.Id);
    wall.appendChild(card);
  }
}

$('#searchBox').addEventListener('input', e => {
  const k = e.target.value.trim().toLowerCase();
  renderWall(state.items.filter(x => x.Name.toLowerCase().includes(k)));
});

/* ---------- 详情/播放 ---------- */
async function openDetail(id){
  try{
    const it = await api('/Items/'+id);
    state.current = it;
    $('#mTitle').textContent = it.Name;
    $('#mSub').textContent = (it.Type==='Series'?'剧集':it.Type==='Episode'?'剧集':'电影') +
      (it.ProductionYear?' · '+it.ProductionYear:'') + (it.Container?' · '+it.Container:'');
    $('#mDesc').textContent = it.Overview || '暂无简介。';
    $('#mPoster').src = '/Items/'+it.Id+'/Images/Primary?maxWidth=300&api_key='+encodeURIComponent(state.token);
    $('#mPoster').style.visibility='visible';
    const player = $('#player'); player.classList.add('hidden'); player.removeAttribute('src'); player.load();
    $('#playBtn').classList.remove('hidden');
    const pb = $('#playBtn');
    // 剧集/剧 -> 导航到子项
    if(it.Type==='Series' || it.Type==='Season' || it.IsFolder){
      pb.textContent = '查看内容';
      pb.onclick = () => { $('#modal').classList.remove('show'); browseChildren(it); };
    } else {
      pb.textContent = '▶ 播放';
      pb.onclick = () => playItem(it);
    }
    $('#modal').classList.add('show');
  }catch(e){ alert('打开失败：'+e.message); }
}

async function browseChildren(it){
  const res = await api('/Users/'+state.user.Id+'/Items?ParentId='+it.Id+'&Recursive=false');
  const items = res.Items || [];
  if(items.length===1 && (items[0].Type==='Season')){
    return browseChildren(items[0]);
  }
  // 直接播放第一个可播放条目；否则刷新墙面为子项
  const playable = items.find(x=>x.Type==='Episode'||x.Type==='Movie');
  if(playable && items.length===1){ return openDetail(playable.Id); }
  state.items = items; renderWall(items);
  window.scrollTo(0,0);
}

async function playItem(it){
  try{
    const info = await api('/Items/'+it.Id+'/PlaybackInfo', {method:'POST', body:'{}'});
    const src = (info.MediaSources && info.MediaSources[0] && info.MediaSources[0].DirectStreamUrl) || '';
    if(!src){ alert('该条目没有可播放的媒体源。'); return; }
    const player = $('#player');
    player.classList.remove('hidden');
    player.src = src;
    $('#playBtn').classList.add('hidden');
    player.play().catch(()=>{});
    api('/Sessions/Playing', {method:'POST', body: JSON.stringify({ItemId:it.Id, PlayMethod:'DirectStream'})}).catch(()=>{});
  }catch(e){ alert('播放失败：'+e.message); }
}

$('#modalClose').onclick = () => { $('#modal').classList.remove('show'); const p=$('#player'); p.pause(); };

/* ---------- 后台 ---------- */
async function loadAdmin(){
  if(!state.user || !state.user.IsAdmin) return;
  try{
    const s = await api('/admin/stats');
    $('#stats').innerHTML = [
      ['电影', s.movies], ['剧集', s.episodes], ['剧', s.series],
      ['用户', s.users], ['媒体库', s.libraries], ['STRM', s.strmCount||0], ['日志', s.activity]
    ].map(([l,n])=>'<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('');
    const lic = s.license || {};
    $('#opsInfo').textContent = '存储:'+(s.backend||'-')+' · TMDB:'+(s.tmdbEnabled?'开':'关')
      +' · 豆瓣:'+(s.doubanEnabled?'开':'关')+' · STRM:'+(s.strmCount||0)
      +' · 监听:'+(s.watchEnabled?'开':'关')+' · 探测:'+(s.probedCount||0)+'/'+(s.movies+s.episodes)
      +' · 授权:'+(lic.mode||'-');
    $('#scrapeBtn').disabled = !(s.tmdbEnabled||s.doubanEnabled);
    $('#syncBtn').disabled = !s.xiaoyaConfigured;
    $('#probeBtn').disabled = !s.probeEnabled;
    const users = await api('/Users');
    $('#usersBody').innerHTML = users.map(u=>{
      const p = u.Policy || {};
      const dev = (p.MaxActiveDevices && p.MaxActiveDevices>0) ? p.MaxActiveDevices : '不限';
      return '<tr><td>'+esc(u.Name)+'</td><td>'+(u.IsAdmin?'是':'否')+'</td>'+
        '<td>'+(p.EnableMediaPlayback===false?'<span style="color:#ff8f8f">禁止</span>':'允许')+'</td>'+
        '<td>'+(p.EnableContentDownloading===false?'<span style="color:#ff8f8f">禁止</span>':'允许')+'</td>'+
        '<td>'+dev+'</td>'+
        '<td><button data-edit="'+u.Id+'">编辑</button> '+(u.Name==='admin'?'':'<button class="danger" data-del="'+u.Id+'">删除</button>')+'</td></tr>';
    }).join('');
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('确认删除该用户？')) return;
      await api('/Users/'+b.dataset.del,{method:'DELETE'}); loadAdmin();
    });
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
      const u = users.find(x=>x.Id===b.dataset.edit); editPolicy(u);
    });
    loadLogs();
    loadEnhancements();
  }catch(e){ /* 非管理员忽略 */ }
}

async function loadLogs(){
  const t=$('#logType').value||'all';
  try{
    const act=await api('/admin/logs?type='+encodeURIComponent(t)+'&limit=100');
    $('#logInfo').textContent=(act.TotalRecordCount||0)+' 条';
    $('#activityBody').innerHTML=(act.Items||[]).map(a=>(
      '<tr><td style="color:var(--muted);white-space:nowrap">'+esc((a.Date||'').replace('T',' ').slice(0,19))+'</td>'+
      '<td><span class="tag">'+esc(a.Type||'')+'</span></td>'+
      '<td>'+esc(a.Name)+'</td><td style="color:var(--muted)">'+esc(a.ShortOverview||'')+'</td></tr>'
    )).join('') || '<tr><td colspan="4" class="empty">暂无日志</td></tr>';
  }catch(e){ $('#activityBody').innerHTML='<tr><td colspan="4" class="empty">加载失败：'+esc(e.message)+'</td></tr>'; }
}
async function loadEnhancements(){
  try{
    const e=await api('/admin/enhancements');
    $('#setServerName').value=e.ServerName||'';
    $('#setScanConc').value=e.ScanConcurrency||1;
    $('#setWatchDelay').value=e.WatchDelaySeconds||30;
    $('#setProxyDebug').checked=!!e.ProxyDebug;
    $('#setFastCDN').checked=!!e.FastCDN;
    $('#setInitials').checked=!!e.SearchByInitials;
    if($('#setWatch')) $('#setWatch').checked=!!e.WatchEnabled;
    if($('#setMergeFolder')) $('#setMergeFolder').checked=!!e.MergeVersionsInFolder;
    if($('#setMergeLibs')) $('#setMergeLibs').checked=!!e.MergeVersionsAcrossLibraries;
  }catch(e){}
}
$('#logType').onchange=()=>loadLogs();
$('#logRefreshBtn').onclick=()=>loadLogs();

/* ---------- 文件管理 ---------- */
function parentPath(p){ if(!p||p==='/') return '/'; const t=p.replace(/\/+$/,''); const i=t.lastIndexOf('/'); return i<=0?'/':t.slice(0,i); }
function humanSize(n){ if(!n) return '0B'; const u=['B','KB','MB','GB','TB']; let i=0,x=n; while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(i?1:0)+u[i]; }
async function loadFiles(path){
  const body=$('#filesBody');
  body.innerHTML='<tr><td colspan="4" class="empty">加载中…</td></tr>';
  try{
    const res=await api('/api/files?path='+encodeURIComponent(path));
    $('#fileInfo').textContent=(res.total||0)+' 项';
    let rows='';
    if(path!=='/') rows+='<tr><td><a href="#" data-dir="'+esc(parentPath(path))+'">..</a></td><td>目录</td><td></td><td></td></tr>';
    for(const e of (res.entries||[])){
      const nameCell=e.isDir?'<a href="#" data-dir="'+esc(e.path)+'">'+esc(e.name)+'/</a>':esc(e.name);
      const size=e.isDir?'':humanSize(e.size);
      rows+='<tr><td>'+nameCell+'</td><td>'+(e.isDir?'目录':'文件')+'</td><td>'+size+'</td>'+
        '<td><button class="danger" data-file-del="'+esc(e.path)+'">删除</button>'+
        (e.isDir?' <button data-file-ren="'+esc(e.path)+'">重命名</button>':'')+'</td></tr>';
    }
    body.innerHTML=rows||'<tr><td colspan="4" class="empty">空目录</td></tr>';
    body.querySelectorAll('[data-dir]').forEach(a=>a.onclick=(ev)=>{ev.preventDefault();$('#filePath').value=a.dataset.dir;loadFiles(a.dataset.dir);});
    body.querySelectorAll('[data-file-del]').forEach(b=>b.onclick=async()=>{
      const p=b.dataset.fileDel; if(!confirm('确认删除 '+p+' ?')) return;
      try{ await api('/api/files',{method:'DELETE',body:JSON.stringify({Paths:[p]})}); loadFiles($('#filePath').value||'/'); }
      catch(e){ alert('删除失败：'+e.message); }
    });
    body.querySelectorAll('[data-file-ren]').forEach(b=>b.onclick=async()=>{
      const p=b.dataset.fileRen; const nn=prompt('新的目录名（同级）',p.split('/').pop()); if(!nn) return;
      const dir=p.substring(0,p.lastIndexOf('/')); const np=dir+'/'+nn;
      try{ await api('/api/files/rename',{method:'POST',body:JSON.stringify({OldPath:p,NewPath:np})}); loadFiles($('#filePath').value||'/'); }
      catch(e){ alert('重命名失败：'+e.message); }
    });
  }catch(e){ body.innerHTML='<tr><td colspan="4" class="empty">加载失败：'+esc(e.message)+'</td></tr>'; }
}
$('#fileListBtn').onclick=()=>{ loadFiles($('#filePath').value||'/'); };

/* ---------- 上传海报 ---------- */
$('#posterFile').onchange = async (ev)=>{
  const f=ev.target.files[0]; if(!f||!state.current) return;
  try{
    const buf=await f.arrayBuffer();
    const r=await fetch('/Items/'+state.current.Id+'/Images/Primary',{method:'POST',headers:{'X-Emby-Token':state.token,'Content-Type':f.type||'image/jpeg'},body:buf});
    if(!r.ok) throw new Error('HTTP '+r.status);
    $('#mPoster').src='/Items/'+state.current.Id+'/Images/Primary?maxWidth=300&api_key='+encodeURIComponent(state.token)+'&t='+Date.now();
    alert('海报已上传');
  }catch(e){ alert('上传失败：'+e.message); }
};

  $('#tab-library').classList.toggle('hidden', tab!=='library');

  $('#tab-files').classList.toggle('hidden', tab!=='files');
  if(tab==='admin') loadAdmin();
  if(tab==='files') loadFiles($('#filePath').value || '/');
});

  applyLang();
  const savedUser = localStorage.getItem('ge_user');
  if(state.token && savedUser){
    state.user = JSON.parse(savedUser);
    enterApp();
    // 校验令牌是否仍有效
    api('/Users/Me').then(u=>{ state.user=u; localStorage.setItem('ge_user',JSON.stringify(u)); $('#who').textContent=u.Name+(u.IsAdmin?' · 管理员':''); })
      .catch(()=>logout());
  }
})();
