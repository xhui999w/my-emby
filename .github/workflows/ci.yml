name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: vet+build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -o go-emby${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
